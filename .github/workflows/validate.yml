name: Validate static sites
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: npm run check
      - name: Build static collection
        run: npm run build
      - name: Install browser verification
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify showcase in browser
        run: node tests/showcase-browser.mjs
      - name: Upload showcase screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-screenshots
          path: artifacts/showcase
          if-no-files-found: ignore
